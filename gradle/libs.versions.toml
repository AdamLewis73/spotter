# Version catalog. Single source of truth for dependency versions;
# modules reference these aliases rather than hard-coding numbers.
#
# Versions verified against Google Maven and Maven Central on 2026-08-10.
# `architecture.md` requires checking current versions before use rather than
# trusting a remembered number.

[versions]
# AGP 9.3.1 exists but has no published release notes, so its Gradle floor is
# unverified. 9.2.x is documented: Gradle 9.4.1 minimum, JDK 17 minimum,
# max API 37.0. Bump once 9.3's requirements are published.
agp = "9.2.1"
kotlin = "2.4.10"

compileSdk = "37"
minSdk = "26"
targetSdk = "37"

# KSP moved to independent versioning — it is no longer <kotlin>-<ksp>, and
# there is no 2.4.x line to match Kotlin 2.4.10. 2.3.11 is the current release.
ksp = "2.3.11"
room = "2.8.4"
# 0.9.0 is the only release and dates from 2017. Unmaintained but stable and
# still the standard JVM morphological analyser; the 12.7 MB jar is mostly its
# embedded IPADIC dictionary.
kuromoji = "0.9.0"

androidx-core = "1.19.0"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
compose-bom = "2026.06.01"

junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
# collectAsStateWithLifecycle: a plain collectAsState keeps collecting while the
# app is backgrounded, which is wasted work and a source of surprise.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

# The BOM pins every Compose artifact, so Compose libraries below carry no version.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Icons are no longer bundled with material3. `-core` carries the handful of
# standard glyphs (back arrow, close); `-extended` is thousands of icons and
# several MB, which this app has no use for.
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# Both versioned by the Compose BOM, like every other Compose artifact here.
# ui-test-manifest is a DEBUG dependency, not a test one: it contributes the
# empty activity `createComposeRule()` launches into, and that has to be merged
# into the app under test's manifest rather than the test APK's.
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

kuromoji-ipadic = { group = "com.atilika.kuromoji", name = "kuromoji-ipadic", version.ref = "kuromoji" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
# Pinned only to force it UP. Nothing here calls Espresso directly — it arrives
# transitively behind Compose's test rule, which routes idle-synchronisation
# through it — and it arrived as **3.5.0**, from 2022. Espresso reflects into the
# hidden `InputManager.getInstance()`, removed since; on this API 37 emulator
# every Compose test died with `NoSuchMethodException` before running a single
# assertion. Verified against Google Maven on 2026-08-19: 3.7.0 is the newest
# stable, per architecture.md's rule about not trusting remembered versions.
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE: there is deliberately no `org.jetbrains.kotlin.android` plugin here.
# AGP 9.0+ has built-in Kotlin support and applying it is an error. Almost every
# tutorial predating 2026 will tell you to add it — don't.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
