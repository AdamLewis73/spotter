# Version catalog. Single source of truth for dependency versions;
# modules reference these aliases rather than hard-coding numbers.
#
# Versions verified against Google Maven and Maven Central on 2026-08-10.
# `architecture.md` requires checking current versions before use rather than
# trusting a remembered number.

[versions]
# AGP 9.3.1 exists but has no published release notes, so its Gradle floor is
# unverified. 9.2.x is documented: Gradle 9.4.1 minimum, JDK 17 minimum,
# max API 37.0. Bump once 9.3's requirements are published.
agp = "9.2.1"
kotlin = "2.4.10"

compileSdk = "37"
minSdk = "26"
targetSdk = "37"

androidx-core = "1.19.0"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
compose-bom = "2026.06.01"

junit = "4.13.2"
androidx-test-junit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

# The BOM pins every Compose artifact, so Compose libraries below carry no version.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE: there is deliberately no `org.jetbrains.kotlin.android` plugin here.
# AGP 9.0+ has built-in Kotlin support and applying it is an error. Almost every
# tutorial predating 2026 will tell you to add it — don't.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
