name: CI

# Plain Python. No Claude, no tokens — this spends Actions minutes, which are
# free and unlimited on a public repository. Deliberately unrelated to
# claude-code-review.yml, which is manual-only for the reasons in D-59.

on:
  push:
    paths-ignore: ['**/*.md']      # doc-only pushes have nothing to build
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

# A rapid series of pushes should not queue a series of builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ':data and :domain must not import android.*'
        # :domain is a Kotlin/JVM module, so this is already a compile error
        # there (D-60) — it is checked anyway so the rule is stated in one place
        # and survives :domain ever changing type.
        #
        # :data is where this actually earns its keep: it is an Android library,
        # so android.* IS on its classpath and only this grep stops it drifting in.
        #
        # androidx.* is deliberately NOT matched. Room is androidx, and the
        # `android\.` pattern does not match `androidx.` because of the dot.
        run: |
          if grep -rnE '^\s*import\s+android\.' \
               --include='*.kt' --include='*.java' \
               data/src domain/src 2>/dev/null; then
            echo "::error::android.* imported in :data or :domain. This is the"
            echo "iOS-portability line (D-60, architecture.md). Android types"
            echo "belong in :app — if the code needs one, it is in the wrong module."
            exit 1
          fi
          echo "No android.* imports outside :app."

      - name: No third-party fixtures in the repository
        # The photographs used to calibrate the scan geometry are other people's
        # and this repository is public, so they are gitignored under a `probe-`
        # prefix and only ever live on a developer's machine. What survives of
        # them is measured rectangles in RealNoticeLayoutTest and numbers in the
        # docs.
        #
        # .gitignore already prevents this; the check exists because the cost of
        # being wrong is a history rewrite, and because `git add -f` and an
        # edited .gitignore both go around it. Same reasoning as the layering
        # grep above, which is also already enforced elsewhere.
        run: |
          # Mirrors the two .gitignore rules exactly, so the check and the
          # ignore cannot drift into disagreeing about what is forbidden.
          if git ls-files | grep -E '^(app/src/androidTest/assets/probe-|fixtures-raw/)'; then
            echo "::error::A probe- fixture is committed. These are third-party"
            echo "images kept local-only — see the .gitignore comment. Remove it"
            echo "before this reaches a public history."
            exit 1
          fi
          echo "No third-party fixtures committed."

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      # checkout v5+ and setup-python v6+ are the first releases targeting
      # Node 24; v4/v5 target the deprecated Node 20 and the runner warns.
      # Do not downgrade.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        working-directory: tools/dictbuild
        # Stdlib unittest — the builder takes no dependencies, so CI needs no
        # install step either.
        run: python -m unittest discover -p 'test_*.py' -v

  build:
    name: Build and verify the dictionary
    runs-on: ubuntu-latest
    needs: unit
    steps:
      # checkout v5+ and setup-python v6+ are the first releases targeting
      # Node 24; v4/v5 target the deprecated Node 20 and the runner warns.
      # Do not downgrade.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # No fetch step: the sources are committed (D-55), so this proves the
      # build works from a clean checkout with no network at all.
      - name: Build spotter.db
        working-directory: tools/dictbuild
        run: python build.py

      - name: Run verification cases
        working-directory: tools/dictbuild
        # verify.py exits non-zero if any case fails, which fails the job.
        run: python verify.py

      - name: Check the build is deterministic (D-58, D-64, V-25)
        working-directory: tools/dictbuild
        # This checksums the SHIPPED ARTEFACT, not a proxy for it. Until
        # 2026-08-11 it could only check keys.tsv.gz, because meta.built_at put
        # a wall-clock timestamp inside the database and guaranteed its bytes
        # differed on every build. With that moved to build-info.json (D-64),
        # the database itself is byte-reproducible and gets checked directly.
        #
        # build-info.json is deliberately excluded — it is the one output that
        # is *meant* to vary.
        run: |
          sha256sum data/build/spotter.db data/build/keys.tsv.gz > first.sha
          PYTHONHASHSEED=12345 python build.py > /dev/null
          sha256sum -c first.sha

      - name: Report size against the D-56 band
        working-directory: tools/dictbuild
        run: |
          bytes=$(stat -c%s data/build/spotter.db)
          mb=$(( bytes / 1048576 ))
          echo "spotter.db ${mb} MB"
          echo "### Dictionary: ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -lt 90 ] || [ "$mb" -gt 115 ]; then
            echo "::error::${mb} MB is outside the expected 90-115 MB band (D-56)."
            echo "Re-measure per object before accepting: drop each table and"
            echo "index in turn, VACUUM, record the delta. The total hides a"
            echo "single table moving the wrong way."
            exit 1
          fi

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is a committed binary. This verifies it against Gradle's
      # published checksums, so a tampered wrapper cannot quietly execute in CI.
      #
      # gradle/actions v6+ is the first line targeting Node 24; v4 and v5 target
      # the deprecated Node 20 and the runner warns. Same rule as checkout and
      # setup-python above — do not downgrade.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The dictionary is gitignored, so a fresh checkout has none and
      # :app:stageDictionaryAsset would fail. Building it here is not a
      # workaround — it is the actual guarantee that master never contains an
      # APK built from a stale dictionary, because CI always regenerates it from
      # the committed sources (D-55). The local staleness check in
      # app/build.gradle.kts is a fast warning; this is the real defence.
      - name: Build the dictionary
        working-directory: tools/dictbuild
        run: python build.py

      - uses: gradle/actions/setup-gradle@v6

      # The runner image ships an Android SDK, but not necessarily the platform
      # this project compiles against. Install it explicitly rather than relying
      # on whatever the image happens to include this month.
      #
      # NOTE the ".0". From API 37 the platforms carry MINOR versions, so the
      # installed packages are android-37.0 and android-37.1 and there is no
      # bare `android-37`. AGP maps `compileSdk = 37` onto the .0 minor, so that
      # is what gets installed. Asking for "platforms;android-37" fails with
      # "Failed to find package", which reads like the platform does not exist
      # yet rather than like a naming problem.
      #
      # build-tools is pinned to AGP 9.2's default rather than derived from
      # compileSdk — they version independently, and 37.0.0 is not what AGP asks
      # for just because compileSdk is 37.
      - name: Install the compileSdk platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          compile_sdk=$(grep -oP 'compileSdk\s*=\s*"\K[0-9]+' gradle/libs.versions.toml)
          platform="platforms;android-${compile_sdk}.0"
          echo "compileSdk=${compile_sdk} -> ${platform}"

          # `yes |` races the pipe closing and prints "Broken pipe"; a bounded
          # number of confirmations does the same job quietly.
          printf 'y\n%.0s' $(seq 40) | "$SDKMANAGER" --licenses > /dev/null

          "$SDKMANAGER" "$platform" "build-tools;36.0.0"
          echo "Installed platforms:"
          ls "$ANDROID_HOME/platforms"

      # :domain is a plain Kotlin/JVM module, so these are ordinary JUnit tests
      # with no emulator (D-60). This is where the scan geometry is proven —
      # reading order, ruby separation, line breaks and the crop transform
      # (D-75-D-78) — which is the highest-risk logic in the app and the reason
      # it was put in a JVM module in the first place (D-76).
      - name: Domain unit tests
        run: ./gradlew :domain:test

      # :data is an Android library, so its JVM tests live under the debug
      # variant. Small, but it holds the Kuromoji tokenizer, and CI ran nothing
      # from this module until 2026-08-27.
      - name: Data unit tests
        run: ./gradlew :data:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      # Compiled, not run. The instrumented tests need a device, and an emulator
      # in CI costs 10-20 minutes and is flaky — for coverage that largely
      # duplicates the :domain cases above, which prove the same geometry in
      # seconds. What CI could not catch until now is the test code failing to
      # *compile*, which breaks anyone running the suite locally and shows up as
      # a confusing Gradle error rather than as a test failure. That is worth two
      # minutes; running them is not.
      - name: Compile the instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest

      # Proves the dictionary actually reached the APK. A build that quietly
      # produced an app with no dictionary would otherwise pass every check
      # above, which is precisely the silent failure this phase is guarding
      # against.
      - name: Confirm the dictionary is in the APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          if ! unzip -l "$apk" | grep -q 'assets/spotter.db'; then
            echo "::error::spotter.db is missing from $apk"
            unzip -l "$apk" | grep assets/ || echo "(no assets at all)"
            exit 1
          fi
          entry=$(unzip -l "$apk" | grep 'assets/spotter.db')
          echo "$entry"
          echo "### APK: $(du -h "$apk" | cut -f1), dictionary present" >> "$GITHUB_STEP_SUMMARY"
